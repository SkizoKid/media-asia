<!DOCTYPE html>
<html lang="id">

<head>
    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-5QDLJN54');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap Generator - Media Asia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0b;
            color: #e0e0e0;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-12">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5QDLJN54" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="max-w-4xl mx-auto">
        <div class="mb-12 text-center">
            <h1 class="text-4xl font-bold text-white mb-4">Sitemap Generator</h1>
            <p class="text-gray-400">Generate sitemap.xml secara otomatis dari database Video.json Anda.</p>
        </div>

        <div class="glass rounded-3xl p-8 shadow-2xl">
            <div class="flex flex-col md:flex-row gap-4 mb-8">
                <input id="baseUrl" type="text" value="https://media-asia.com"
                    class="flex-1 bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                    placeholder="Domain Website (e.g. https://media-asia.com)">
                <button onclick="generateSitemap()"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg shadow-blue-600/20 active:scale-95">
                    Generate XML
                </button>
            </div>

            <div id="status"
                class="hidden mb-6 p-4 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 text-sm text-center">
                Generating...
            </div>

            <div class="relative group">
                <div class="absolute top-4 right-4 flex gap-2">
                    <button onclick="copyToClipboard()"
                        class="bg-white/10 hover:bg-white/20 text-white text-[10px] uppercase font-bold px-3 py-1.5 rounded-lg transition-all backdrop-blur-md border border-white/10">
                        Copy
                    </button>
                    <button onclick="downloadSitemap()"
                        class="bg-blue-600/80 hover:bg-blue-600 text-white text-[10px] uppercase font-bold px-3 py-1.5 rounded-lg transition-all backdrop-blur-md border border-blue-600/20">
                        Download
                    </button>
                </div>
                <textarea id="output" readonly
                    class="w-full h-96 bg-black/60 border border-white/5 rounded-2xl p-6 font-mono text-xs text-blue-300/80 focus:outline-none scrollbar-hide"
                    placeholder="XML akan muncul di sini..."></textarea>
            </div>

            <div class="mt-6 text-[10px] text-gray-500 uppercase tracking-widest text-center font-semibold">
                Media Asia SEO Utility Tool • v1.0
            </div>
        </div>
    </div>

    <script>
        async function generateSitemap() {
            const baseUrl = document.getElementById('baseUrl').value.replace(/\/$/, '');
            const status = document.getElementById('status');
            const output = document.getElementById('output');

            status.textContent = "Mengambil data video...";
            status.classList.remove('hidden');

            try {
                const response = await fetch('https://raw.githubusercontent.com/AgungDevlop/Viral/refs/heads/main/Video.json');
                const videos = await response.json();

                let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
                xml += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';

                // Add Home
                xml += '  <url>\n';
                xml += `    <loc>${baseUrl}/</loc>\n`;
                xml += '    <changefreq>daily</changefreq>\n';
                xml += '    <priority>1.0</priority>\n';
                xml += '  </url>\n';

                // Add Videos
                videos.forEach(video => {
                    xml += '  <url>\n';
                    xml += `    <loc>${baseUrl}/play/${video.id}</loc>\n`;
                    xml += '    <changefreq>weekly</changefreq>\n';
                    xml += '    <priority>0.8</priority>\n';
                    xml += '  </url>\n';
                });

                xml += '</urlset>';

                output.value = xml;
                status.textContent = `Berhasil! ${videos.length + 1} URL terdeteksi.`;
                status.classList.replace('bg-blue-500/10', 'bg-green-500/10');
                status.classList.replace('text-blue-400', 'text-green-400');
            } catch (error) {
                status.textContent = "Gagal mengambil data. Pastikan koneksi internet aktif.";
                status.classList.replace('bg-blue-500/10', 'bg-red-500/10');
                status.classList.replace('text-blue-400', 'text-red-400');
                console.error(error);
            }
        }

        function copyToClipboard() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');
            alert('XML disalin ke clipboard!');
        }

        function downloadSitemap() {
            const output = document.getElementById('output').value;
            if (!output) return alert('Generate XML terlebih dahulu!');

            const blob = new Blob([output], { type: 'text/xml' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'sitemap.xml';
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }
    </script>
</body>

</html>
