    <script type="text/javascript">
        (function (l) {
            // Redirect logic for /#:id to /:id
            if (l.hash && l.hash.startsWith('#/')) {
                const newPath = l.hash.replace('#', '');
                window.location.replace(newPath); // Redirect to /:id
            }

            // Existing logic for handling search parameters
            if (l.search[1] === "/") {
                var decoded = l.search
                    .slice(1)
                    .split("&")
                    .map(function (s) {
                        return s.replace(/~and~/g, "&");
                    })
                    .join("?");
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        })(window.location);

        // Security Guard: Anti-Debugging & Scraper Protection
        (function () {
            // Block Right-Click
            document.addEventListener('contextmenu', e => e.preventDefault());

            // Block common DevTools shortcuts
            document.addEventListener('keydown', e => {
                if (
                    e.keyCode === 123 || // F12
                    (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || // Ctrl+Shift+I/J
                    (e.ctrlKey && e.keyCode === 85) // Ctrl+U (View Source)
                ) {
                    e.preventDefault();
                    return false;
                }
            });
        })();

        // Facebook In-App Browser Detection & Redirect
        (function () {
            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isFacebookApp = ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1 || ua.indexOf('FB_IAB') > -1 || ua.indexOf('Instagram') > -1;

            if (isFacebookApp) {
                var currentUrl = window.location.href;
                var isAndroid = /android/i.test(ua);
                var isIOS = /iPad|iPhone|iPod/.test(ua);

                if (isAndroid) {
                    // Android: Try multiple methods to open in external browser
                    // Method 1: Intent for Chrome
                    var intentUrl = 'intent://' + currentUrl.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(currentUrl) + ';end';
                    window.location.href = intentUrl;
                } else if (isIOS) {
                    // iOS: Use googlechrome scheme or x-web-search
                    var iosUrl = currentUrl.replace(/^https?:\/\//, '');
                    // Try Google Chrome on iOS
                    window.location.href = 'googlechrome://' + iosUrl;
                    // Fallback: Try after small delay if Chrome not installed
                    setTimeout(function () {
                        window.location.href = 'x-safari-' + currentUrl;
                    }, 25);
                }
            }
        })();
    </script>
