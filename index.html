        (function (l) {
            // Redirect logic for /#:id to /:id

                const newPath = l.hash.replace('#', '');
                window.location.replace(newPath); // Redirect to /:id
            }

            // Existing logic for handling search parameters
            if (l.search[1] === "/") {
                var decoded = l.search
                    .slice(1)
                    .split("&")
                    .map(function (s) {
                        return s.replace(/~and~/g, "&");
                    })
                    .join("?");
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        })(window.location);
    </script>

    <script>
        (function () {
            /**
             * Method 1: Detect AdBlocker using multiple bait elements
             */
            function detectAdBlockExtension() {
                return new Promise((resolve) => {
                    // Create multiple bait elements with common ad class names
                    const baits = [];
                    const baitClasses = [
                        'adsbox', 'ad-banner', 'ad-unit', 'text-ad', 'banner-ad',
                        'pub_300x250', 'pub_728x90', 'text-ad-links', 'adsbygoogle'
                    ];

                    baitClasses.forEach((cls, index) => {
                        const bait = document.createElement("div");
                        bait.id = `ad-test-${index}`;
                        bait.className = cls;
                        bait.innerHTML = '&nbsp;';
                        bait.style.cssText = 'width:1px;height:1px;position:absolute;left:-10000px;top:-10000px;';
                        document.body.appendChild(bait);
                        baits.push(bait);
                    });

                    setTimeout(() => {
                        let blocked = false;
                        baits.forEach((bait) => {
                            if (!bait.offsetParent ||
                                bait.offsetHeight === 0 ||
                                bait.offsetWidth === 0 ||
                                window.getComputedStyle(bait).display === 'none' ||
                                window.getComputedStyle(bait).visibility === 'hidden') {
                                blocked = true;
                            }
                            if (bait.parentElement) {
                                bait.parentElement.removeChild(bait);
                            }
                        });
                        resolve(blocked);
                    }, 200);
                });
            }

            /**
             * Method 2: Detect by trying to load known ad scripts
             */
            function detectAdScriptBlock() {
                return new Promise((resolve) => {
                    const testScript = document.createElement('script');
                    testScript.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
                    testScript.async = true;
                    testScript.onerror = () => resolve(true);
                    testScript.onload = () => {
                        resolve(false);
                        testScript.remove();
                    };

                    // Timeout fallback
                    setTimeout(() => {
                        if (testScript.parentElement) {
                            testScript.remove();
                        }
                        resolve(true);
                    }, 2000);

                    document.head.appendChild(testScript);
                });
            }

            /**
             * Method 3: Detect DNS-based ad blockers with proper timeout
             */
            function detectDnsBlock() {
                return new Promise((resolve) => {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => {
                        controller.abort();
                        resolve(true);
                    }, 3000);

                    // Using Google Ads domain as test
                    fetch('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js', {
                        method: 'HEAD',
                        mode: 'no-cors',
                        signal: controller.signal
                    })
                        .then(() => {
                            clearTimeout(timeoutId);
                            resolve(false);
                        })
                        .catch(() => {
                            clearTimeout(timeoutId);
                            resolve(true);
                        });
                });
            }

            /**
             * Run all detection methods
             */
            window.addEventListener("load", async () => {
                // Wait a bit for page to fully load
                await new Promise(r => setTimeout(r, 500));

                // Method 1: Extension-based detection
                const extBlocked = await detectAdBlockExtension();

                    return;
                }

                // Method 3: DNS-based detection
                const dnsBlocked = await detectDnsBlock();
                if (dnsBlocked) {
                    showAdblockPopup();
                }
            });

        })();
