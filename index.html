    <script type="text/javascript">
        (function (l) {
            // Redirect logic for /#:id to /:id
            if (l.hash && l.hash.startsWith('#/')) {
                const newPath = l.hash.replace('#', '');
                window.location.replace(newPath); // Redirect to /:id
            }

            // Existing logic for handling search parameters
            if (l.search[1] === "/") {
                var decoded = l.search
                    .slice(1)
                    .split("&")
                    .map(function (s) {
                        return s.replace(/~and~/g, "&");
                    })
                    .join("?");
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        })(window.location);

        // Security Guard: Anti-Debugging & Scraper Protection
        (function () {
            // Block Right-Click
            document.addEventListener('contextmenu', e => e.preventDefault());

            // Block common DevTools shortcuts
            document.addEventListener('keydown', e => {
                if (
                    e.keyCode === 123 || // F12
                    (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || // Ctrl+Shift+I/J
                    (e.ctrlKey && e.keyCode === 85) // Ctrl+U (View Source)
                ) {
                    e.preventDefault();
                    return false;
                }
            });
        })();
    </script>
